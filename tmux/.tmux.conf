set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"

set -g set-clipboard on

setw -g mode-keys vi
set -g status-keys vi

bind | split-window -h
bind - split-window -v

set -g mouse on
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g history-limit 10000

bind -n C-x setw synchronize-panes\; display-message "broadcast toggled"
bind r source-file ~/.tmux.conf \; display-message "Reloaded"

bind j choose-window "join-pane -t '%%'"
bind B break-pane
bind S command-prompt -I "#W" -p "New session name:" "new-session -d -s '%%' ; move-window -t '%%' ; switch-client -t '%%'"
bind h display-popup -w 80% -h 80% -E "~/.tmux/scripts/cheatsheet"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Rounded bubble-style window tabs
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #T"
set -g @catppuccin_window_current_text " #T"
set -g @catppuccin_window_flags "icon"

# Session persistence: auto-save every 15 min, restore on tmux start
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Status left: session name (turns red when prefix is active)
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left-length 100

# Status right: directory + date/time (no duplicative window title)
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -g status-right-length 100
